<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Thinkers for UPSC Mains — Essay &amp; Ethics</title>
<meta name="description" content="Philosophers and thinkers asked in UPSC Essay and GS-IV Ethics, organised with core ideas, quotations and syllabus links.">
<!-- Roboto Slab carries the reading text; everything else stays on system faces. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;600&display=swap">
<!-- The stylesheet and scripts below are loaded with a fresh timestamp every visit,
     so an edited file is never served from a stale browser cache. -->
<script>
  document.write('<link rel="stylesheet" href="styles.css?v=' + Date.now() + '">');
</script>
<noscript><link rel="stylesheet" href="styles.css"></noscript>
</head>
<body>

<header class="topbar" id="topbar">
  <a class="skip" href="#main">Skip to main content</a>
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Show or hide the navigation"
          aria-controls="sidebar" aria-expanded="true" title="Show or hide the navigation">&#9776;</button>
  <a class="brand" href="./" data-to="home|0|" title="Home">
    <div class="brand-mark">&#x0950;</div>
    <div class="brand-text">
      <h1>Thinkers for UPSC Mains</h1>
      <p>Ideas &middot; Questions &middot; Better answers</p>
    </div>
  </a>
  <!-- the sections, on a band that runs out to the right edge -->
  <div class="band">
    <nav class="topnav" id="topNav" aria-label="Sections"></nav>
    <button class="band-btn" id="searchBtn" aria-label="Search" aria-controls="searchBar"
            aria-expanded="false" title="Search (press /)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
      </svg>
    </button>
    <button class="band-btn band-atlas" data-to="atlas|0|" aria-label="Human Thought Atlas" title="Human Thought Atlas">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5z"></path>
      </svg>
    </button>
    <button class="band-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle light / dark">&#9789;</button>
  </div>
  <div class="searchbar" id="searchBar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="search" type="search" placeholder="Search a thinker, idea, quote or theme…" autocomplete="off">
      <span class="kbd">Esc</span>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <button class="rail-btn" id="railBtn" aria-controls="sidebar" aria-expanded="true"
            title="Collapse the panel"><i>&laquo;</i><span>Collapse</span></button>
    <div id="viewNav"></div>
    <div class="side-label" id="catLabel">Schools &amp; Traditions</div>
    <div id="catNav"></div>
  </nav>

  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="overlay" id="overlay">
  <article class="sheet" id="sheet"></article>
</div>

<script>
  // async=false keeps them executing in this exact order.
  //
  // Locally we bust the cache on every load, so an edited file shows up on a
  // plain refresh. Once deployed that would be wasteful -- the data files are
  // well over a megabyte and never change between releases -- so a published
  // copy uses a fixed version instead and lets the browser cache properly.
  // Bump BUILD when the data files change.
  (function () {
    var BUILD = '2026-09-26c';
    var local = ['localhost', '127.0.0.1', '::1', ''].indexOf(location.hostname) !== -1
                || location.protocol === 'file:';
    var v = local ? Date.now() : BUILD;
    ['data.js', 'portraits.js', 'profiles.js', 'hindi.js',
     'works.js', 'worklab.js', 'covers.js', 'mcqs.js', 'answers.js', 'guides.js', 'essays.js','pyq.js', 'glossary.js', 'openouts.js', 'gs4pyq.js', 'gs4concepts.js', 'cases.js', 'gs4gloss.js', 'atlas.js', 'app.js'].forEach(function (f) {
      var s = document.createElement('script');
      s.src = f + '?v=' + v;
      s.async = false;
      document.head.appendChild(s);
    });
  })();
</script>
</body>
</html>
