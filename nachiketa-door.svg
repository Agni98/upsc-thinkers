<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t">
<title id="t">Nachiketa waits three nights at the door of Death</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#080a22"/><stop offset=".55" stop-color="#1c1840"/>
    <stop offset=".82" stop-color="#3a2442"/><stop offset="1" stop-color="#4c2d3c"/></linearGradient>
  <linearGradient id="dawnG" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#f6a95e" stop-opacity=".95"/><stop offset=".45" stop-color="#c8607a" stop-opacity=".45"/>
    <stop offset="1" stop-color="#3a2a6a" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#fff6dc" stop-opacity=".55"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/></radialGradient>
  <radialGradient id="lampGlow"><stop offset="0" stop-color="#ffd27a" stop-opacity=".85"/>
    <stop offset=".4" stop-color="#ff9a3c" stop-opacity=".28"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
  <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#e2572a"/><stop offset=".45" stop-color="#ffb347"/><stop offset="1" stop-color="#fff4c8"/></linearGradient>
  <radialGradient id="doorLight" cx=".5" cy=".85" r=".75">
    <stop offset="0" stop-color="#fff2c4"/><stop offset=".4" stop-color="#f5b25a" stop-opacity=".8"/>
    <stop offset="1" stop-color="#8a3d1f" stop-opacity="0"/></radialGradient>
  <radialGradient id="mistG"><stop offset="0" stop-color="#d9d2ff" stop-opacity=".12"/><stop offset="1" stop-color="#d9d2ff" stop-opacity="0"/></radialGradient>
  <clipPath id="doorway"><path d="M1056,800 V560 Q1056,446 1180,432 Q1304,446 1304,560 V800 Z"/></clipPath>
  <filter id="rim" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
  .stars circle{fill:#f3eedc;animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  .stars{animation:night 36s linear infinite}
  @keyframes night{0%,84%{opacity:1}94%,97%{opacity:.15}100%{opacity:1}}
  .moon{transform-box:view-box;transform-origin:800px 1300px;animation:arc 12s linear infinite}
  @keyframes arc{0%{transform:rotate(-58deg);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:rotate(58deg);opacity:0}}
  .dawn{opacity:0;animation:dawn 36s ease-in-out infinite}
  @keyframes dawn{0%,84%{opacity:0}94%,97%{opacity:.8}100%{opacity:0}}
  .lamp .fire{opacity:0}
  .l1 .fire{animation:l1 36s linear infinite}
  .l2 .fire{animation:l2 36s linear infinite}
  .l3 .fire{animation:l3 36s linear infinite}
  @keyframes l1{0%{opacity:0}3%,96%{opacity:1}100%{opacity:0}}
  @keyframes l2{0%,33%{opacity:0}36%,96%{opacity:1}100%{opacity:0}}
  @keyframes l3{0%,66%{opacity:0}69%,96%{opacity:1}100%{opacity:0}}
  .flick{transform-box:fill-box;transform-origin:50% 100%;animation:fl 1.4s ease-in-out infinite}
  .l2 .flick{animation-delay:-.5s} .l3 .flick{animation-delay:-.9s}
  @keyframes fl{0%,100%{transform:scale(1,1)}30%{transform:scale(.9,1.09)}55%{transform:scale(1.06,.94)}80%{transform:scale(.96,1.04)}}
  .warm{animation:warm 36s linear infinite}
  @keyframes warm{0%{opacity:.1}3%,33%{opacity:.35}36%,66%{opacity:.6}69%,96%{opacity:.85}100%{opacity:.1}}
  .doorlight{opacity:0;animation:dl 36s ease-in-out infinite}
  @keyframes dl{0%,86%{opacity:0}94%,97%{opacity:1}100%{opacity:0}}
  .leafL{animation:lL 36s ease-in-out infinite} .leafR{animation:lR 36s ease-in-out infinite}
  @keyframes lL{0%,86%{transform:translateX(0)}94%,97%{transform:translateX(-64px)}100%{transform:translateX(0)}}
  @keyframes lR{0%,86%{transform:translateX(0)}94%,97%{transform:translateX(64px)}100%{transform:translateX(0)}}
  .breath{transform-box:fill-box;transform-origin:50% 100%;animation:br 5s ease-in-out infinite}
  @keyframes br{50%{transform:scale(1.012)}}
  .mist{animation:mist 20s ease-in-out infinite alternate}
  @keyframes mist{from{transform:translateX(-50px)}to{transform:translateX(50px)}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .lamp .fire{opacity:1} .moon{transform:rotate(-14deg)} .warm{opacity:.8}}
</style>

