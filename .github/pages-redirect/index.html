<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thinkers for UPSC has moved to thinkers.okayupsc.com</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://thinkers.okayupsc.com/">
<script>
  // The old address keeps its place on the new one: the page after the
  // repository name and the part after the # both carry over, so
  // .../upsc-thinkers/#/some/page opens https://thinkers.okayupsc.com/#/some/page.
  (function () {
    var rest = location.pathname.replace(/^\/upsc-thinkers/, '') || '/';
    location.replace('https://thinkers.okayupsc.com' + rest + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://thinkers.okayupsc.com/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: #1d1c1a; background: #f6f4ef; }
  a { color: #9a3412; font-weight: 600; }
</style>
</head>
<body>
<p>Thinkers for UPSC has moved to <a href="https://thinkers.okayupsc.com/">thinkers.okayupsc.com</a>.</p>
</body>
</html>
